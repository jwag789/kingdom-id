# Local development dependencies. `docker compose up -d` gives the IdP a
# Postgres and a Redis; the apps themselves run on the host via `pnpm dev`.
# Host ports are offset from the defaults so they don't collide with other
# local databases.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kingdom
      POSTGRES_PASSWORD: kingdom
      POSTGRES_DB: kingdom_id
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingdom -d kingdom_id"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
