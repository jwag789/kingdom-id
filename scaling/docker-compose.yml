# Two Kingdom ID instances behind Caddy, sharing one Postgres and one Redis.
# No sticky sessions: any request may land on either instance. Driven by
# run-proof.sh and run-bench.sh; secrets are throwaway test values.
name: kingdom-scaling

x-idp: &idp
  # One image, two containers.
  image: kingdom-id:scaling
  build: ..
  environment: &idp-env
    NODE_ENV: production
    ISSUER: https://localhost:9443
    PORT: "4000"
    DATABASE_URL: postgres://kingdom:kingdom@postgres:5432/kingdom_id
    REDIS_URL: redis://redis:6379
    KEY_ENCRYPTION_KEY: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
    SERVER_SECRET: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ=
    TRUST_PROXY: "true"
    # The benchmark hammers one client from one IP; keep the limiter in the
    # path (its Redis calls are part of the cost) but out of the way.
    RATE_LIMIT_MULTIPLIER: "10000"
    LOG_LEVEL: warn
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/readyz"]
    interval: 2s
    retries: 60

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kingdom
      POSTGRES_PASSWORD: kingdom
      POSTGRES_DB: kingdom_id
    command: ["postgres", "-c", "max_connections=200"]
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingdom -d kingdom_id"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  idp-1:
    <<: *idp
    environment:
      <<: *idp-env
      INSTANCE_ID: idp-1

  idp-2:
    <<: *idp
    environment:
      <<: *idp-env
      INSTANCE_ID: idp-2

  lb:
    image: caddy:2.10.2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "9443:9443"
      - "9444:9444"
    depends_on:
      idp-1: { condition: service_healthy }
      idp-2: { condition: service_healthy }

  k6:
    image: grafana/k6:1.3.0
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    profiles: ["bench"]
