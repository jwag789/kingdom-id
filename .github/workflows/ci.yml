name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  terraform:
    name: Terraform (deploy/aws)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.x"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts real Postgres and Redis on the runner's Docker.
      - run: pnpm test

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kingdom
          POSTGRES_PASSWORD: kingdom
          POSTGRES_DB: kingdom_id
        ports: ["54320:5432"]
        options: >-
          --health-cmd "pg_isready -U kingdom -d kingdom_id"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["63790:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kingdom-id/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  conformance:
    name: OpenID conformance (Basic OP)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Builds Kingdom ID, starts the pinned conformance suite release next to
      # it, and runs the Basic OP certification plan. Fails on any result not
      # listed in conformance/expected-*.json.
      - run: conformance/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: conformance/results
          retention-days: 30

  scaling:
    name: Two instances + k6 benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds two Kingdom ID instances behind a round-robin load balancer and
      # proves a session survives bouncing between them and losing one.
      - run: scaling/run-proof.sh
      # Reference benchmark on a GitHub runner: a consistent machine that
      # never sleeps, but only 2 vCPUs for all seven containers, so 20 VUs
      # keeps it below saturation. Thresholds fail the job on any error or a
      # p95 over 500 ms, which makes this a regression guard for the token path.
      - run: scaling/run-bench.sh
        env:
          VUS: "20"
          DURATION: "60s"
      - name: Benchmark summary
        if: always()
        run: cat scaling/results/k6-*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaling-results
          path: scaling/results
          retention-days: 30
