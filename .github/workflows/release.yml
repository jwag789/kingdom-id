name: Release

# Builds and publishes the container image when a version tag is pushed
# (git tag v1.2.3 && git push --tags). Optionally rolls it out to ECS.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # for AWS OIDC, when deploying
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Runs only once AWS is set up: set the repository variable AWS_DEPLOY_ROLE_ARN
  # to a role trusting GitHub's OIDC provider (see docs/deploy.md).
  deploy:
    needs: image
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Render task definition with the new image
        run: |
          aws ecs describe-task-definition --task-definition kingdom-id \
            --query taskDefinition > task.json
          jq --arg image "${{ needs.image.outputs.image }}" \
            '.containerDefinitions[0].image = $image
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task.json > task-new.json
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-new.json
          service: kingdom-id
          cluster: kingdom-id
          wait-for-service-stability: true

  # Runs once a single machine is set up (docs/deploy-lightsail.md): set the
  # repository variables DEPLOY_HOST (the machine's address) and ISSUER_HOST,
  # and the secret DEPLOY_SSH_KEY (a key that can SSH in as DEPLOY_USER,
  # default ubuntu, with passwordless sudo). Secrets stay on the machine:
  # install.sh generates them there on the first run.
  deploy-single-host:
    needs: image
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-single-host
    steps:
      - uses: actions/checkout@v4
      - name: Trust the machine's SSH host key
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          # Optional: pin the key (ssh-keyscan output) instead of trusting it on first use.
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 15 "$DEPLOY_HOST" > ~/.ssh/known_hosts; fi
      - name: Install the SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Copy the deployment files
        env:
          TARGET: ${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" 'mkdir -p kingdom-id'
          scp -i ~/.ssh/deploy_key deploy/single-host/docker-compose.yml deploy/single-host/Caddyfile deploy/single-host/install.sh "$TARGET:kingdom-id/"
      - name: Install and start
        env:
          TARGET: ${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_HOST }}
          IMAGE: ${{ needs.image.outputs.image }}
          ISSUER_HOST: ${{ vars.ISSUER_HOST }}
          # This job's own token: it can pull the private image and expires when the job ends.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # The token goes over stdin, never onto a command line where `ps` would show it.
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$TARGET" \
            "read -r GHCR_TOKEN && export GHCR_TOKEN GHCR_USER='$GHCR_USER' && sudo --preserve-env=GHCR_TOKEN,GHCR_USER kingdom-id/install.sh '$IMAGE' '$ISSUER_HOST'"
