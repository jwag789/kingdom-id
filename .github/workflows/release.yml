name: Release

# Builds and publishes the container image when a version tag is pushed
# (git tag v1.2.3 && git push --tags). Optionally rolls it out to ECS.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # for AWS OIDC, when deploying
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Runs only once AWS is set up: set the repository variable AWS_DEPLOY_ROLE_ARN
  # to a role trusting GitHub's OIDC provider (see docs/deploy.md).
  deploy:
    needs: image
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Render task definition with the new image
        run: |
          aws ecs describe-task-definition --task-definition kingdom-id \
            --query taskDefinition > task.json
          jq --arg image "${{ needs.image.outputs.image }}" \
            '.containerDefinitions[0].image = $image
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task.json > task-new.json
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-new.json
          service: kingdom-id
          cluster: kingdom-id
          wait-for-service-stability: true
